  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  video.layer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }

    position:absolute; top:0; bottom:0; width:200px; left:-300px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%);

    pointer-events:none; display:none; z-index:5;
  }
  #preloadHost { position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; }
  #hud {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

         overflow:hidden; position:relative; transition:width 0.35s ease; }
  .dot.trans { height:6px; width:6px; border-radius:3px; }
  .dot .fill { position:absolute; left:0; top:0; bottom:0; width:0%;
               background:rgba(255,255,255,0.97); border-radius:inherit; }
  .dot.done .fill { width:100%; }
  .dot.current { width:30px; }
  .dot.trans.current { width:22px; }
  #hint, #dots { transition:opacity 0.6s ease; }
  .fade-out #hint, .fade-out #dots { opacity:0; }
  #tweaks {
    position:fixed; top:0; right:0; bottom:0; width:380px; z-index:20;
    background:rgba(12,12,14,0.92); color:#eee; overflow-y:auto;

const trims = {

const music = {

  hawaii:  "https://ucf28ef7e4cf73a9a3cd41eb8495.dl.dropboxusercontent.com/cd/0/inline/DDzR_YpIQKDmsBHnyctj7XJGaSgZQTMGF5-_JN8JDTxxSqZmK_ZHGYXmDQiSiJ_RLmCUCmtweeg4paI24gppSz_lsLCIPCfyT7EmzzrFzcK7yfo863a_GGKaX2VpoCAvOK4/file",
  sf:      "https://uc3db76bafc998b81e6971affdb0.dl.dropboxusercontent.com/cd/0/inline/DDxtOhuKeWxbXVhlZq124DyT73eesS0zqvJTH2Aursrzwc5NpoWx_mgcJXaNL-34U0sqbxHGNkKh1oFS8Qtlql_ehbVD4Z257CqVDelswWrGjGXa2TddF9cGI9C38pLn9oM/file",
  lisbon:  "https://uc2c98c66fcbe92cd36571090fb3.dl.dropboxusercontent.com/cd/0/inline/DDw5AS7rl9Ar5Af6hWf7X4-irvhSHrdPj8tyc0arcgaFA6MaD61RZVAl5RQQfag8mw3Uh6_LAc-DWAEWANJ8_KGRBDW55Rz-2YlwtG0c9aNzDxhUTaZLyFCuS2-aMOh40BQ/file",
};

const v = [document.getElementById("v0"), document.getElementById("v1")];
const blurbar = document.getElementById("blurbar");
const stopName = document.getElementById("stopName");
const hint = document.getElementById("hint");
const hud = document.getElementById("hud");
const tweaks = document.getElementById("tweaks");
const dotsWrap = document.getElementById("dots");
const dotEls = segs.map(s => {
  const d = document.createElement("span");
  d.className = "dot" + (s.type !== "city" ? " trans" : "");
  const f = document.createElement("span");

let active = 0;
let segIndex = 0;
let mode = "start";
let busy = false;
const WIPE_MS = 1100;
const BAR = 200;
const MUSIC_FADE_MS = 2500;
const DEPARTURE_PAN_EXTRA_SEC = 2;
const MIN_DEPARTURE_FADE_SEC = 0.75;
const JOURNEY_END_MS = 5000;
const MIN_END_PLAYBACK_RATE = 0.06;
const IS_IOS_WEBKIT = (
  /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
) && /WebKit/.test(navigator.userAgent);

function cur()  { return v[active]; }
function idle() { return v[1 - active]; }
function trimOf(i) { return trims[segs[i].clip]; }
function fileOf(i) { return clips[segs[i].clip].file; }
function clipUrl(key) { return CDN + clips[key].file; }
function segmentTiming(i, el) {
  const tr = trimOf(i);
  const a = tr.start || 0;
  const duration = el && el.duration && isFinite(el.duration) ? el.duration : a + 0.1;
  const b = Math.max(a + 0.1, duration - (tr.end || 0));
  const range = b - a;
  const elapsed = clamp01((((el && el.currentTime) || 0) - a) / range) * range;
  return { elapsed, range };
}
function segmentProgress(i, el) {
  const timing = segmentTiming(i, el);
  return clamp01(timing.elapsed / timing.range);
}
function departureEnvelopeProgress(i, el) {
  const timing = segmentTiming(i, el);
  const latestPanEnd = Math.max(0.1, timing.range - MIN_DEPARTURE_FADE_SEC);
  const panEnd = Math.max(
    0.1,
    Math.min(latestPanEnd, timing.range * 0.5 + DEPARTURE_PAN_EXTRA_SEC)
  );
  if (timing.elapsed < panEnd) return 0.5 * clamp01(timing.elapsed / panEnd);
  return 0.5 + 0.5 * clamp01((timing.elapsed - panEnd) / Math.max(0.1, timing.range - panEnd));
}

const preloadedVideos = {};
let forceMutedVideos = false;

function preloadVideos() {
  const host = document.getElementById("preloadHost");
  Object.keys(clips).forEach(key => {
    if (preloadedVideos[key]) return;
    const el = document.createElement("video");
    el.preload = "auto";
    el.playsInline = true;
    el.muted = true;
    el.src = clipUrl(key);
    preloadedVideos[key] = el;
    host.appendChild(el);
    try { el.load(); } catch(e) {}
  });
}

function applyVideoMuteState() {
  v.forEach(el => { el.muted = forceMutedVideos; });
  Object.values(preloadedVideos).forEach(el => { el.muted = true; });
}

function prepareVideoAudioForPlay(el) {
  if (IS_IOS_WEBKIT && !forceMutedVideos && el !== cur()) {
    el.dataset.mobileSafariAudioHandoff = "1";
    el.muted = true;
    el.volume = 0;
    return;
  }
  delete el.dataset.mobileSafariAudioHandoff;
  el.muted = forceMutedVideos;
}

function playVideo(el) {
  prepareVideoAudioForPlay(el);
  try {
    const playPromise = el.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(() => {
        forceMutedVideos = true;
        applyVideoMuteState();
        try { el.play().catch(()=>{}); } catch(e) {}
      });
    }
  } catch(e) {
    forceMutedVideos = true;
    applyVideoMuteState();
    try { el.play().catch(()=>{}); } catch(err) {}
  }
}

function hasMobileSafariAudioHandoff(el) {
  return el.dataset.mobileSafariAudioHandoff === "1";
}

function clamp01(value) {
  return Math.min(1, Math.max(0, Number.isFinite(value) ? value : 0));
}

function setMediaVolume(el, value) {
  el.volume = clamp01(value);
}

function updateTransitionAudio(old, incoming, t) {
  t = clamp01(t);
  if (!hasMobileSafariAudioHandoff(incoming)) {
    setMediaVolume(incoming, t);
    setMediaVolume(old, 1 - t);
    return;
  }

  if (t < 0.5) {
    old.muted = forceMutedVideos;
    setMediaVolume(old, 1 - t / 0.5);
    incoming.muted = true;
    setMediaVolume(incoming, 0);
  } else {
    setMediaVolume(old, 0);
    old.muted = true;
    incoming.muted = forceMutedVideos;
    setMediaVolume(incoming, (t - 0.5) / 0.5);
  }
}

function finishTransitionAudio(old, incoming) {
  delete incoming.dataset.mobileSafariAudioHandoff;
  setMediaVolume(old, 1);
  setMediaVolume(incoming, 1);
  old.muted = forceMutedVideos;
  incoming.muted = forceMutedVideos;
}

// ---------- MP3/Web Audio music engine ----------
let audioCtx = null;
const musicBuffers = {};
const musicLoads = {};
let musicCity = null;      // city whose track is (or is fading) active
let musicSource = null;
let musicNodes = null;
let musicStopTimer = null;
let musicRequestId = 0;

const NEUTRAL_HIGHPASS_HZ = 20;
const TINNY_HIGHPASS_HZ = 900;
const NEUTRAL_LOWPASS_HZ = 20000;
const TINNY_LOWPASS_HZ = 2600;

function getAudioContext() {
  if (audioCtx) return audioCtx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  audioCtx = new Ctx();
  return audioCtx;
}

function unlockAudio() {
  const ctx = getAudioContext();
  if (ctx && ctx.state === "suspended") ctx.resume().catch(()=>{});
}

function decodeAudio(ctx, data) {
  return new Promise((resolve, reject) => {
    const maybePromise = ctx.decodeAudioData(data, resolve, reject);
    if (maybePromise && maybePromise.then) maybePromise.then(resolve).catch(reject);
  });
}

function loadMusicBuffer(cityKey) {
  if (musicBuffers[cityKey]) return Promise.resolve(musicBuffers[cityKey]);
  if (musicLoads[cityKey]) return musicLoads[cityKey];
  const ctx = getAudioContext();
  if (!ctx || !music[cityKey]) return Promise.reject(new Error("Audio unavailable"));
  musicLoads[cityKey] = fetch(music[cityKey])
    .then(r => {
      if (!r.ok) throw new Error(`Could not load ${music[cityKey]}`);
      return r.arrayBuffer();
    })
    .then(data => decodeAudio(ctx, data))
    .then(buffer => {
      musicBuffers[cityKey] = buffer;
      return buffer;
    })
    .catch(err => {
      delete musicLoads[cityKey];
      console.warn(err);
      throw err;
    });
  return musicLoads[cityKey];
}

function preloadMusic() {
  ["karachi","hawaii","sf","lisbon"].forEach(k => loadMusicBuffer(k).catch(()=>{}));
}

function setAudioParam(param, value, timeConstant = 0.03) {
  if (!audioCtx || !param) return;
  const now = audioCtx.currentTime;
  param.cancelScheduledValues(now);
  param.setTargetAtTime(value, now, timeConstant);
}

function setAudioParamNow(param, value) {
  if (!audioCtx || !param) return;
  const now = audioCtx.currentTime;
  param.cancelScheduledValues(now);
  param.setValueAtTime(value, now);
}

function holdAudioParam(param) {
  if (!audioCtx || !param) return;
  const now = audioCtx.currentTime;
  if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(now);
  else {
    const value = param.value;
    param.cancelScheduledValues(now);
    param.setValueAtTime(value, now);
  }
}

function createPanner(ctx) {
  if (ctx.createStereoPanner) {
    const node = ctx.createStereoPanner();
    return {
      node,
      setPan(value, immediate = false) {
        (immediate ? setAudioParamNow : setAudioParam)(node.pan, value);
      },
    };
  }
  const node = ctx.createPanner();
  node.panningModel = "equalpower";
  return {
    node,
    setPan(value) {
      const x = Math.max(-1, Math.min(1, value));
      if (node.positionX) {
        setAudioParam(node.positionX, x);
        setAudioParam(node.positionY, 0);
        setAudioParam(node.positionZ, 1 - Math.abs(x));
      } else {
        node.setPosition(x, 0, 1 - Math.abs(x));
      }
    },
  };
}

function applyMusicTone(pan, highpassHz, lowpassHz, immediate = false) {
  if (!musicNodes) return;
  const setter = immediate ? setAudioParamNow : setAudioParam;
  musicNodes.panner.setPan(pan, immediate);
  setter(musicNodes.highpass.frequency, highpassHz);
  setter(musicNodes.lowpass.frequency, lowpassHz);
}

function stopMusicNow() {
  musicRequestId++;
  clearTimeout(musicStopTimer);
  musicStopTimer = null;
  if (musicSource) {
    try { musicSource.onended = null; musicSource.stop(); } catch(e) {}
  }
  musicSource = null;
  musicNodes = null;
  musicCity = null;
}

// Start a city's track (fades in). Triggered when the tunnel->city arrival
// transition STARTS (and on back-navigation directly into a city).
function musicStart(cityKey, entrance = "normal") {
  const ctx = getAudioContext();
  if (!ctx) return;
  unlockAudio();
  if (musicCity === cityKey && musicSource) return; // already playing this city's track
  const instantStart = cityKey === "karachi" && entrance === "normal";
  stopMusicNow();
  musicCity = cityKey;
  const requestId = ++musicRequestId;
  loadMusicBuffer(cityKey).then(buffer => {
    if (requestId !== musicRequestId || musicCity !== cityKey) return;
    const source = ctx.createBufferSource();
    const highpass = ctx.createBiquadFilter();
    const lowpass = ctx.createBiquadFilter();
    const panner = createPanner(ctx);
    const envelopeGain = ctx.createGain();
    const mainGain = ctx.createGain();

    source.buffer = buffer;
    highpass.type = "highpass";
    lowpass.type = "lowpass";
    envelopeGain.gain.setValueAtTime(1, ctx.currentTime);
    mainGain.gain.setValueAtTime(instantStart ? 1 : 0, ctx.currentTime);
    highpass.frequency.setValueAtTime(NEUTRAL_HIGHPASS_HZ, ctx.currentTime);
    lowpass.frequency.setValueAtTime(NEUTRAL_LOWPASS_HZ, ctx.currentTime);

    source.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(panner.node);
    panner.node.connect(envelopeGain);
    envelopeGain.connect(mainGain);
    mainGain.connect(ctx.destination);

    musicSource = source;
    musicNodes = { mainGain, envelopeGain, highpass, lowpass, panner };
    if (entrance === "arrival") applyMusicTone(1, TINNY_HIGHPASS_HZ, TINNY_LOWPASS_HZ, true);
    else applyMusicTone(0, NEUTRAL_HIGHPASS_HZ, NEUTRAL_LOWPASS_HZ, true);

    source.onended = () => {
      if (musicSource === source) {
        musicSource = null;
        musicNodes = null;
        musicCity = null;
      }
    };
    source.start(0);
    if (!instantStart) mainGain.gain.linearRampToValueAtTime(1, ctx.currentTime + MUSIC_FADE_MS / 1000);
  }).catch(()=>{ if (requestId === musicRequestId) stopMusicNow(); });
}

// Hard stop with a short fade (used only for back-navigation away from a city).
function musicStop() {
  musicFadeOut(900);
}

function musicFadeOut(ms) {
  if (!musicCity || !musicNodes || !audioCtx) { stopMusicNow(); return; }
  const source = musicSource;
  const nodes = musicNodes;
  musicCity = null;
  musicRequestId++;
  clearTimeout(musicStopTimer);
  holdAudioParam(nodes.mainGain.gain);
  nodes.mainGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + ms / 1000);
  musicStopTimer = setTimeout(() => {
    if (musicSource === source) stopMusicNow();
  }, ms + 50);
}

// Arrival envelope, driven by the tunnel->city transition's playback progress:
//   0%..50%  : pan full right -> center, and open the distant/tinny filter
//   50%..100%: hold normal center audio.
function musicArrivalEnvelope(progress) {
  if (!musicCity || !musicNodes) return;
  if (progress < 0.5) {
    const t = progress / 0.5;
    applyMusicTone(
      1 - t,
      TINNY_HIGHPASS_HZ + (NEUTRAL_HIGHPASS_HZ - TINNY_HIGHPASS_HZ) * t,
      TINNY_LOWPASS_HZ + (NEUTRAL_LOWPASS_HZ - TINNY_LOWPASS_HZ) * t
    );
  } else {
    applyMusicTone(0, NEUTRAL_HIGHPASS_HZ, NEUTRAL_LOWPASS_HZ);
  }
}

// Departure envelope, driven by the city->tunnel transition's playback progress:
//   0%..50%  : pan center -> full left, and narrow the EQ into a distant/tinny band
//   50%..100%: volume fades linearly 100 -> 0, with the pan/filter held
//   100%     : track stopped.
function musicDepartureEnvelope(progress) {
  if (!musicCity || !musicNodes) return;
  if (progress < 0.5) {
    const t = progress / 0.5;
    setAudioParam(musicNodes.envelopeGain.gain, 1);
    applyMusicTone(
      -t,
      NEUTRAL_HIGHPASS_HZ + (TINNY_HIGHPASS_HZ - NEUTRAL_HIGHPASS_HZ) * t,
      NEUTRAL_LOWPASS_HZ + (TINNY_LOWPASS_HZ - NEUTRAL_LOWPASS_HZ) * t
    );
  } else if (progress < 1) {
    const t = (progress - 0.5) / 0.5;
    applyMusicTone(-1, TINNY_HIGHPASS_HZ, TINNY_LOWPASS_HZ);
    setAudioParam(musicNodes.envelopeGain.gain, 1 - t);
  } else {
    stopMusicNow();
  }
}
// ------------------------------------------

function setMask(el, x) {
  const g = `linear-gradient(to right, rgba(0,0,0,0) ${x - BAR/2}px, rgba(0,0,0,1) ${x + BAR/2}px)`;
  el.style.webkitMaskImage = g;
  el.style.maskImage = g;
}
function clearMask(el) { el.style.webkitMaskImage = ""; el.style.maskImage = ""; }

function updateHud() {
  const s = segs[segIndex];
  stopName.textContent = s.name;
  if (mode === "start") hint.textContent = "Space / \u2192 to depart \u00b7 \u2190 / Backspace back \u00b7 Tab: tweaks";
  else if (segIndex === segs.length - 1) hint.textContent = "Journey's end \u00b7 \u2190 / Backspace back \u00b7 Tab: tweaks";
  else hint.textContent = "Space / \u2192: continue \u00b7 \u2190 / Backspace: back \u00b7 Tab: tweaks";
  dotEls.forEach((d, i) => {
    d.classList.toggle("done", i < segIndex);
    d.classList.toggle("current", i === segIndex);
  });
}

function load(el, i) {
  el.onended = null;
  el.loop = false;
  el.playbackRate = 1;
  el.src = clipUrl(segs[i].clip);
  const t = trimOf(i).start || 0;
  if (t > 0) {
    el.addEventListener("loadedmetadata", function seekOnce() {
      el.currentTime = Math.min(t, Math.max(0, (el.duration || t)));
      el.removeEventListener("loadedmetadata", seekOnce);
    });
  } else {
    el.currentTime = 0;
  }
}

function wipeTo(el, onDone, outgoingIndex = segIndex) {
  busy = true;
  const W = window.innerWidth;
  const start = performance.now();
  const old = cur();
  setMask(el, W + BAR);
  el.style.zIndex = 2; old.style.zIndex = 1;
  el.style.opacity = 1;
  blurbar.style.display = "block";
  const from = W + BAR/2, to = -BAR/2 - 60;
  function frame(now) {
    const t = Math.min(1, (now - start) / WIPE_MS);
    const x = from + (to - from) * t;
    setMask(el, x);
    blurbar.style.left = (x - BAR/2) + "px";
    updateTransitionAudio(old, el, t);
    if (isDeparture(outgoingIndex)) musicDepartureEnvelope(departureEnvelopeProgress(outgoingIndex, old));
    if (t < 1) requestAnimationFrame(frame);
    else {
      blurbar.style.display = "none";
      clearMask(el);
      if (isDeparture(outgoingIndex)) musicDepartureEnvelope(1);
      old.pause(); old.style.opacity = 0;
      finishTransitionAudio(old, el);
      active = 1 - active;
      busy = false;
      onDone && onDone();
    }
  }
  requestAnimationFrame(frame);
}

function fadeTo(el, onDone) {
  busy = true;
  const old = cur();
  el.style.zIndex = 2; old.style.zIndex = 1;
  el.style.transition = "opacity 0.9s ease";
  el.style.opacity = 0;
  requestAnimationFrame(() => { el.style.opacity = 1; });
  const start = performance.now();
  (function ramp(now){
    const t = Math.min(1,(now-start)/900);
    updateTransitionAudio(old, el, t);
    if (t<1) requestAnimationFrame(ramp);
  })(performance.now());
  setTimeout(() => {
    old.pause(); old.style.opacity = 0;
    finishTransitionAudio(old, el);
    el.style.transition = "";
    active = 1 - active;
    busy = false;
    onDone && onDone();
  }, 950);
}

// Music triggers:
//  - arrival transition (tunnel->city) STARTS  -> start that city's track
//  - departure transition (city->tunnel) plays -> progress envelope (see above)
//  - back-navigation directly into a city      -> start that city's track
function isArrival(i)   { return segs[i] && segs[i].type === "trans" && segs[i+1] && segs[i+1].type === "city"; }
function isDeparture(i) { return segs[i] && segs[i].type === "trans" && segs[i+1] && segs[i+1].type === "tunnel"; }

function wipeToSegment(i) {
  const outgoingIndex = segIndex;
  if (isArrival(outgoingIndex) && i !== outgoingIndex) musicArrivalEnvelope(1);
  segIndex = i;
  const el = idle();
  load(el, i);
  playVideo(el);
  updateHud();
  if (isArrival(i)) musicStart(segs[i+1].clip, "arrival");   // music begins with the arrival clip
  wipeTo(el, null, outgoingIndex);
}

function endJourney() {
  if (mode !== "playing" || segIndex !== segs.length - 1 || busy) return;
  const el = cur();
  mode = "ending";
  busy = true;
  updateHud();
  musicFadeOut(JOURNEY_END_MS);
  const startRate = Math.max(MIN_END_PLAYBACK_RATE, el.playbackRate || 1);
  const start = performance.now();
  function frame(now) {
    const t = clamp01((now - start) / JOURNEY_END_MS);
    const rate = Math.max(MIN_END_PLAYBACK_RATE, startRate * (1 - t));
    try { el.playbackRate = rate; } catch(e) {}
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      el.pause();
      el.playbackRate = 1;
      mode = "ended";
      busy = false;
      updateHud();
    }
  }
  requestAnimationFrame(frame);
}

function goForward() {
  unlockAudio();
  if (busy) return;
  if (mode === "start") {
    mode = "playing";
    playVideo(cur());
    updateHud();
    musicStart(segs[0].clip);
    return;
  }
  if (segIndex >= segs.length - 1) {
    endJourney();
    return;
  }
  const s = segs[segIndex];
  let target;
  if (s.type === "city") target = segIndex + 1;
  else if (s.type === "trans" && segs[segIndex+1] && segs[segIndex+1].type === "tunnel")
    target = segIndex + 2;
  else target = segIndex + 1;
  if (target > segs.length - 1) return;
  wipeToSegment(target);
}

function goBack() {
  unlockAudio();
  if (busy || mode === "start") return;
  const cityIdx = [];
  segs.forEach((s,i)=>{ if (s.type==="city") cityIdx.push(i); });
  let target = -1;
  for (let i = cityIdx.length - 1; i >= 0; i--) {
    if (cityIdx[i] < segIndex) { target = cityIdx[i]; break; }
  }
  if (target < 0) return;
  mode = "playing";
  musicStop();
  segIndex = target;
  const el = idle();
  load(el, segIndex);
  playVideo(el);
  updateHud();
  fadeTo(el, () => { musicStart(segs[segIndex].clip); });
}

function scheduler() {
  if (mode === "playing" && !busy) {
    const el = cur();
    if (el.duration && isFinite(el.duration)) {
      const tr = trimOf(segIndex);
      const effEnd = Math.max(0.2, el.duration - (tr.end || 0));
      const remaining = effEnd - el.currentTime;
      if (remaining <= WIPE_MS / 1000 + 0.05) {
        if (segs[segIndex].type === "city") {
          const nel = idle();
          load(nel, segIndex);
          playVideo(nel);
          wipeTo(nel);      // same city: music keeps playing untouched
        } else if (segIndex < segs.length - 1) {
          wipeToSegment(segIndex + 1);
        }
      }
    }
  }
  requestAnimationFrame(scheduler);
}

function paintProgress() {
  const el = cur();
  let frac = 0;
  let musicFrac = 0;
  let arrivalFrac = 0;
  if (mode !== "start" && el.duration && isFinite(el.duration)) {
    frac = segmentProgress(segIndex, el);
    if (isDeparture(segIndex)) {
      musicFrac = departureEnvelopeProgress(segIndex, el);
    } else if (isArrival(segIndex)) {
      arrivalFrac = frac;
    }
  }
  const d = dotEls[segIndex];
  if (d) d.firstChild.style.width = (d.classList.contains("done") ? 100 : frac * 100) + "%";
  if (isDeparture(segIndex) && mode === "playing") musicDepartureEnvelope(musicFrac);
  if (isArrival(segIndex) && mode === "playing") musicArrivalEnvelope(arrivalFrac);
  requestAnimationFrame(paintProgress);
}

// ---------- tweak pane (ordered by appearance) ----------
const rowsEl = document.getElementById("clipRows");
clipOrder.forEach((key) => {
  const c = clips[key];
  const row = document.createElement("div");
  row.className = "clipRow";
  const isCity = ["karachi","hawaii","sf","lisbon"].includes(key);
  row.innerHTML = `<div class="nm">${c.label}</div>
    <label>start <input type="number" min="0" step="0.1" value="${trims[key].start}" data-k="${key}" data-f="start"></label>
    <label>end <input type="number" min="0" step="0.1" value="${trims[key].end}" data-k="${key}" data-f="end"></label>`
    + (isCity ? `<input class="music" type="text" placeholder="MP3 URL for ${c.label} music" value="${music[key] || ""}" data-mk="${key}">` : "");
  rowsEl.appendChild(row);
});
rowsEl.addEventListener("input", (e) => {
  const k = e.target.dataset.k, f = e.target.dataset.f, mk = e.target.dataset.mk;
  if (k && f) trims[k][f] = Math.max(0, parseFloat(e.target.value) || 0);
  if (mk) {
    music[mk] = e.target.value.trim();
    delete musicBuffers[mk];
    delete musicLoads[mk];
    loadMusicBuffer(mk).catch(()=>{});
  }
});
document.getElementById("copyBtn").addEventListener("click", () => {
  const json = JSON.stringify({ trims, music }, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    document.getElementById("copied").textContent = "copied!";
    setTimeout(()=>document.getElementById("copied").textContent="", 1500);
  }).catch(()=>{ document.getElementById("copied").textContent = json; });
});
let paneOpen = false;
function togglePane() {
  paneOpen = !paneOpen;
  tweaks.style.display = paneOpen ? "block" : "none";
}

function handleScreenTap(clientX) {
  if (paneOpen) return;
  if (clientX >= window.innerWidth / 2) goForward();
  else goBack();
}

// boot
preloadVideos();
preloadMusic();
load(cur(), 0);
cur().pause();
cur().style.opacity = 1;
updateHud();
requestAnimationFrame(paintProgress);
requestAnimationFrame(scheduler);

document.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); togglePane(); return; }
  if (paneOpen && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.repeat) return;
  if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); goBack(); }
  else if (e.key === " " || e.key === "ArrowRight")   { e.preventDefault(); goForward(); }
});

document.addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" || !e.isPrimary) return;
  if (e.target.closest && e.target.closest("#tweaks")) return;
  handleScreenTap(e.clientX);
});

let hudTimer = null;
function wakeHud() {
  hud.classList.remove("fade-out");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.add("fade-out"), 4000);
}
document.addEventListener("keydown", wakeHud);
document.addEventListener("mousemove", wakeHud);
document.addEventListener("mousedown", wakeHud);
document.addEventListener("touchstart", wakeHud, { passive: true });
wakeHud();
</script>
