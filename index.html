<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mythical Train Journey — Karachi to Lisbon</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  video.layer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }
  #blurbar {
    position:absolute; top:0; bottom:0; width:200px; left:-300px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%);
    pointer-events:none; display:none; z-index:5;
  }
  #ytHost { position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; }
  #hud {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:rgba(255,255,255,0.9); text-align:center; user-select:none;
    text-shadow:0 1px 6px rgba(0,0,0,0.8); pointer-events:none;
    transition:opacity 0.6s ease; z-index:10;
  }
  #hud .stop { font-size:30px; font-weight:600; letter-spacing:0.04em; }
  #hud .hint { font-size:13px; opacity:0.75; margin-top:4px; }
  #dots { display:flex; gap:7px; align-items:center; justify-content:center; margin-top:10px; }
  .dot { height:8px; width:8px; border-radius:4px; background:rgba(255,255,255,0.32);
         overflow:hidden; position:relative; transition:width 0.35s ease; }
  .dot.trans { height:6px; width:6px; border-radius:3px; }
  .dot .fill { position:absolute; left:0; top:0; bottom:0; width:0%;
               background:rgba(255,255,255,0.97); border-radius:inherit; }
  .dot.done .fill { width:100%; }
  .dot.current { width:30px; }
  .dot.trans.current { width:22px; }
  #hint, #dots { transition:opacity 0.6s ease; }
  .fade-out #hint, .fade-out #dots { opacity:0; }
  #tweaks {
    position:fixed; top:0; right:0; bottom:0; width:380px; z-index:20;
    background:rgba(12,12,14,0.92); color:#eee; overflow-y:auto;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:13px; padding:16px; box-sizing:border-box; display:none;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #tweaks h2 { font-size:15px; margin:0 0 4px; }
  #tweaks p  { margin:0 0 14px; opacity:0.7; line-height:1.4; }
  .clipRow { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .clipRow .nm { font-weight:600; margin-bottom:6px; }
  .clipRow label { display:inline-flex; align-items:center; gap:6px; margin-right:14px; }
  .clipRow input[type=number] { width:64px; background:#1c1c20; color:#eee; border:1px solid #444;
                   border-radius:6px; padding:4px 6px; font-size:13px; }
  .clipRow input.music { width:100%; box-sizing:border-box; margin-top:6px; background:#1c1c20;
                   color:#eee; border:1px solid #444; border-radius:6px; padding:4px 6px; font-size:12px; }
  #copyBtn { margin-top:6px; padding:8px 14px; border-radius:8px; border:none;
             background:#e8e8ec; color:#111; font-weight:600; cursor:pointer; }
  #copied { margin-left:10px; opacity:0.7; }
</style>
</head>
<body>
<video id="v0" class="layer" playsinline preload="auto"></video>
<video id="v1" class="layer" playsinline preload="auto"></video>
<div id="blurbar"></div>
<div id="ytHost"></div>
<div id="hud">
  <div class="stop" id="stopName">Karachi</div>
  <div class="hint" id="hint"></div>
  <div id="dots"></div>
</div>
<div id="tweaks">
  <h2>Clip trims &amp; music (Tab to close)</h2>
  <p>Seconds chopped off the start / end of each clip; city rows also take a YouTube URL whose audio fades in when the city starts and fades out as the train enters the tunnel. Copy the JSON and send it back to hardcode.</p>
  <div id="clipRows"></div>
  <button id="copyBtn">Copy JSON</button><span id="copied"></span>
</div>

<script>
const CDN = "https://d8j0ntlcm91z4.cloudfront.net/user_3CkO7uW4kLN7beBuWrOrFiFPoSh/";

const segs = [
  { type:"city",   name:"Karachi",                    clip:"karachi" },
  { type:"trans",  name:"Karachi \u2192 Tunnel",       clip:"k2t" },
  { type:"tunnel", name:"Tunnel",                      clip:"tunnel" },
  { type:"trans",  name:"Tunnel \u2192 Hawaii",        clip:"t2h" },
  { type:"city",   name:"Hawaii \u2014 Big Island",    clip:"hawaii" },
  { type:"trans",  name:"Hawaii \u2192 Tunnel",        clip:"h2t" },
  { type:"tunnel", name:"Tunnel",                      clip:"tunnel" },
  { type:"trans",  name:"Tunnel \u2192 San Francisco", clip:"t2sf" },
  { type:"city",   name:"San Francisco",               clip:"sf" },
  { type:"trans",  name:"San Francisco \u2192 Tunnel", clip:"sf2t" },
  { type:"tunnel", name:"Tunnel",                      clip:"tunnel" },
  { type:"trans",  name:"Tunnel \u2192 Lisbon",        clip:"t2l" },
  { type:"city",   name:"Lisbon",                      clip:"lisbon" },
];

const clips = {
  karachi: { label:"Karachi loop",        file:"hf_20260706_184807_1bb23aa0-6f3e-46fe-a371-c992e2c3770c.mp4" },
  k2t:     { label:"Karachi \u2192 Tunnel",       file:"hf_20260706_055132_7a77d922-e20d-4cab-a4e5-7c96fcf63fed.mp4" },
  tunnel:  { label:"Tunnel (1 cycle)",    file:"hf_20260706_055108_33662d28-2019-4398-a3b3-d1c74c77f3d3.mp4" },
  t2h:     { label:"Tunnel \u2192 Hawaii",        file:"hf_20260706_060649_95316a97-c497-4131-8474-8c716dac15b6.mp4" },
  hawaii:  { label:"Hawaii loop",         file:"hf_20260706_231741_3adbdfe5-84f1-40a1-87e4-21a290f26526.mp4" },
  h2t:     { label:"Hawaii \u2192 Tunnel",        file:"hf_20260706_062519_dbd449c2-f03c-4b21-a7cd-88ea4cb5106f.mp4" },
  t2sf:    { label:"Tunnel \u2192 San Francisco", file:"hf_20260706_063148_b5f68075-f0e7-4c69-941e-333b31b82eb5.mp4" },
  sf:      { label:"San Francisco loop",  file:"hf_20260706_185446_6b9ac00c-cb49-4a81-8a32-e013e7d38317.mp4" },
  sf2t:    { label:"San Francisco \u2192 Tunnel", file:"hf_20260706_063201_5a3cff0d-65dc-45ae-88f3-9d92385ff26e.mp4" },
  t2l:     { label:"Tunnel \u2192 Lisbon",        file:"hf_20260706_062557_179e5a1f-47c0-4625-928f-fded57621e0a.mp4" },
  lisbon:  { label:"Lisbon loop",         file:"hf_20260707_002258_a1adb59e-5309-4ec7-8281-bb1c77ed5775.mp4" },
};
// appearance order for the tweak pane
const clipOrder = ["karachi","k2t","tunnel","t2h","hawaii","h2t","t2sf","sf","sf2t","t2l","lisbon"];

// baked-in trim defaults (from tuning session)
const trims = {
  karachi:{start:0,end:0}, hawaii:{start:0,end:0}, sf:{start:0,end:0}, lisbon:{start:0,end:0},
  tunnel:{start:0,end:0},
  k2t:{start:7,end:0}, t2h:{start:3,end:5.5}, h2t:{start:6,end:3},
  t2sf:{start:0,end:6}, sf2t:{start:2,end:3}, t2l:{start:0,end:3},
};

// baked-in city music defaults
const music = {
  karachi: "https://www.youtube.com/watch?v=eK5gPcFjQps",
  hawaii:  "https://www.youtube.com/watch?v=V1bFr2SWP1I&list=RDV1bFr2SWP1I&start_radio=1",
  sf:      "https://www.youtube.com/watch?v=A-7XPCNrD5Y",
  lisbon:  "https://www.youtube.com/watch?v=-sze5rpbklM&list=PL_HoiGNUauFmyCF8zjtJu224F7LmIN9xS",
};

function ytId(url) {
  if (!url) return null;
  const m = url.match(/[?&]v=([A-Za-z0-9_-]{6,})/) || url.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

const v = [document.getElementById("v0"), document.getElementById("v1")];
const blurbar = document.getElementById("blurbar");
const stopName = document.getElementById("stopName");
const hint = document.getElementById("hint");
const hud = document.getElementById("hud");
const tweaks = document.getElementById("tweaks");
const dotsWrap = document.getElementById("dots");
const dotEls = segs.map(s => {
  const d = document.createElement("span");
  d.className = "dot" + (s.type !== "city" ? " trans" : "");
  const f = document.createElement("span");
  f.className = "fill";
  d.appendChild(f);
  dotsWrap.appendChild(d);
  return d;
});

let active = 0;
let segIndex = 0;
let mode = "start";
let busy = false;
const WIPE_MS = 1100;
const BAR = 200;
const MUSIC_FADE_MS = 2500;

function cur()  { return v[active]; }
function idle() { return v[1 - active]; }
function trimOf(i) { return trims[segs[i].clip]; }
function fileOf(i) { return clips[segs[i].clip].file; }

// ---------- YouTube music engine ----------
const ytPlayers = {};      // cityKey -> YT.Player
let ytReady = false;
let musicRamp = null;      // active fade { player, from, to, start, onDone }
let musicCity = null;      // city whose track is (or is fading) active

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = function() {
  ytReady = true;
  ["karachi","hawaii","sf","lisbon"].forEach(k => makePlayer(k, ytId(music[k])));
};
function makePlayer(k, vid) {
  if (!vid) return;
  const host = document.createElement("div");
  host.id = "yt_" + k;
  document.getElementById("ytHost").appendChild(host);
  ytPlayers[k] = new YT.Player(host.id, {
    width: 1, height: 1, videoId: vid,
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
  });
}
function rampMusic(player, from, to, ms, onDone) {
  const start = performance.now();
  musicRamp = { cancel: false };
  const mine = musicRamp;
  (function step(now) {
    if (mine.cancel) return;
    const t = Math.min(1, (now - start) / ms);
    try { player.setVolume(Math.round(from + (to - from) * t)); } catch(e) {}
    if (t < 1) requestAnimationFrame(step);
    else { musicRamp = null; onDone && onDone(); }
  })(performance.now());
}
// Start a city's track (fades in). Triggered when the tunnel->city arrival
// transition STARTS (and on back-navigation directly into a city).
function musicStart(cityKey) {
  if (!ytReady) return;
  const p = ytPlayers[cityKey];
  if (!p || !p.playVideo) return;
  if (musicCity === cityKey) return;          // already playing this city's track
  if (musicRamp) musicRamp.cancel = true;
  if (musicCity && ytPlayers[musicCity]) {
    try { ytPlayers[musicCity].pauseVideo(); } catch(e) {}
  }
  musicCity = cityKey;
  try { p.setVolume(0); p.seekTo(0, true); p.playVideo(); } catch(e) {}
  rampMusic(p, 0, 100, MUSIC_FADE_MS);
}
// Hard stop with a short fade (used only for back-navigation away from a city).
function musicStop() {
  if (!musicCity) return;
  const p = ytPlayers[musicCity];
  musicCity = null;
  if (!p) return;
  if (musicRamp) musicRamp.cancel = true;
  rampMusic(p, (function(){ try { return p.getVolume(); } catch(e){ return 100; } })(), 0, 900,
    () => { try { p.pauseVideo(); } catch(e) {} });
}
// Departure envelope, driven by the city->tunnel transition's playback progress:
//   0%..50%  : pan center -> full left (YouTube iframes cannot be panned by the
//              Web Audio API, so this phase currently holds volume steady; with
//              direct audio files a StereoPannerNode would ramp pan here)
//   50%..100%: volume fades linearly 100 -> 0
//   100%     : track paused.
function musicDepartureEnvelope(progress) {
  if (!musicCity) return;
  const p = ytPlayers[musicCity];
  if (!p) return;
  if (musicRamp) { musicRamp.cancel = true; musicRamp = null; }
  if (progress < 0.5) {
    try { p.setVolume(100); } catch(e) {}     // pan phase (see note above)
  } else if (progress < 1) {
    const v = Math.round(100 * (1 - (progress - 0.5) / 0.5));
    try { p.setVolume(v); } catch(e) {}
  } else {
    const done = musicCity; musicCity = null;
    try { ytPlayers[done].setVolume(0); ytPlayers[done].pauseVideo(); } catch(e) {}
  }
}
// ------------------------------------------

function setMask(el, x) {
  const g = `linear-gradient(to right, rgba(0,0,0,0) ${x - BAR/2}px, rgba(0,0,0,1) ${x + BAR/2}px)`;
  el.style.webkitMaskImage = g;
  el.style.maskImage = g;
}
function clearMask(el) { el.style.webkitMaskImage = ""; el.style.maskImage = ""; }

function updateHud() {
  const s = segs[segIndex];
  stopName.textContent = s.name;
  if (mode === "start") hint.textContent = "Space / \u2192 to depart \u00b7 \u2190 / Backspace back \u00b7 Tab: tweaks";
  else if (segIndex === segs.length - 1) hint.textContent = "Journey's end \u00b7 \u2190 / Backspace back \u00b7 Tab: tweaks";
  else hint.textContent = "Space / \u2192: continue \u00b7 \u2190 / Backspace: back \u00b7 Tab: tweaks";
  dotEls.forEach((d, i) => {
    d.classList.toggle("done", i < segIndex);
    d.classList.toggle("current", i === segIndex);
  });
}

function load(el, i) {
  el.onended = null;
  el.loop = false;
  el.src = CDN + fileOf(i);
  const t = trimOf(i).start || 0;
  if (t > 0) {
    el.addEventListener("loadedmetadata", function seekOnce() {
      el.currentTime = Math.min(t, Math.max(0, (el.duration || t)));
      el.removeEventListener("loadedmetadata", seekOnce);
    });
  } else {
    el.currentTime = 0;
  }
}

function wipeTo(el, onDone) {
  busy = true;
  const W = window.innerWidth;
  const start = performance.now();
  const old = cur();
  setMask(el, W + BAR);
  el.style.zIndex = 2; old.style.zIndex = 1;
  el.style.opacity = 1;
  blurbar.style.display = "block";
  const from = W + BAR/2, to = -BAR/2 - 60;
  function frame(now) {
    const t = Math.min(1, (now - start) / WIPE_MS);
    const x = from + (to - from) * t;
    setMask(el, x);
    blurbar.style.left = (x - BAR/2) + "px";
    el.volume = t; old.volume = 1 - t;
    if (t < 1) requestAnimationFrame(frame);
    else {
      blurbar.style.display = "none";
      clearMask(el);
      old.pause(); old.style.opacity = 0; old.volume = 1; el.volume = 1;
      active = 1 - active;
      busy = false;
      onDone && onDone();
    }
  }
  requestAnimationFrame(frame);
}

function fadeTo(el, onDone) {
  busy = true;
  const old = cur();
  el.style.zIndex = 2; old.style.zIndex = 1;
  el.style.transition = "opacity 0.9s ease";
  el.style.opacity = 0;
  requestAnimationFrame(() => { el.style.opacity = 1; });
  const start = performance.now();
  (function ramp(now){
    const t = Math.min(1,(now-start)/900);
    el.volume = t; old.volume = 1 - t;
    if (t<1) requestAnimationFrame(ramp);
  })(performance.now());
  setTimeout(() => {
    old.pause(); old.style.opacity = 0; old.volume = 1; el.volume = 1;
    el.style.transition = "";
    active = 1 - active;
    busy = false;
    onDone && onDone();
  }, 950);
}

// Music triggers:
//  - arrival transition (tunnel->city) STARTS  -> start that city's track
//  - departure transition (city->tunnel) plays -> progress envelope (see above)
//  - back-navigation directly into a city      -> start that city's track
function isArrival(i)   { return segs[i] && segs[i].type === "trans" && segs[i+1] && segs[i+1].type === "city"; }
function isDeparture(i) { return segs[i] && segs[i].type === "trans" && segs[i+1] && segs[i+1].type === "tunnel"; }

function wipeToSegment(i) {
  segIndex = i;
  const el = idle();
  load(el, i);
  el.play().catch(()=>{});
  updateHud();
  if (isArrival(i)) musicStart(segs[i+1].clip);   // music begins with the arrival clip
  wipeTo(el);
}

function goForward() {
  if (busy) return;
  if (mode === "start") {
    mode = "playing";
    cur().play().catch(()=>{});
    updateHud();
    musicStart(segs[0].clip);
    return;
  }
  if (segIndex >= segs.length - 1) return;
  const s = segs[segIndex];
  let target;
  if (s.type === "city") target = segIndex + 1;
  else if (s.type === "trans" && segs[segIndex+1] && segs[segIndex+1].type === "tunnel")
    target = segIndex + 2;
  else target = segIndex + 1;
  if (target > segs.length - 1) return;
  wipeToSegment(target);
}

function goBack() {
  if (busy || mode === "start") return;
  const cityIdx = [];
  segs.forEach((s,i)=>{ if (s.type==="city") cityIdx.push(i); });
  let target = -1;
  for (let i = cityIdx.length - 1; i >= 0; i--) {
    if (cityIdx[i] < segIndex) { target = cityIdx[i]; break; }
  }
  if (target < 0) return;
  musicStop();
  segIndex = target;
  const el = idle();
  load(el, segIndex);
  el.play().catch(()=>{});
  updateHud();
  fadeTo(el, () => { musicStart(segs[segIndex].clip); });
}

function scheduler() {
  if (mode === "playing" && !busy) {
    const el = cur();
    if (el.duration && isFinite(el.duration)) {
      const tr = trimOf(segIndex);
      const effEnd = Math.max(0.2, el.duration - (tr.end || 0));
      const remaining = effEnd - el.currentTime;
      if (remaining <= WIPE_MS / 1000 + 0.05) {
        if (segs[segIndex].type === "city") {
          const nel = idle();
          load(nel, segIndex);
          nel.play().catch(()=>{});
          wipeTo(nel);      // same city: music keeps playing untouched
        } else if (segIndex < segs.length - 1) {
          wipeToSegment(segIndex + 1);
        }
      }
    }
  }
  requestAnimationFrame(scheduler);
}

function paintProgress() {
  const el = cur();
  let frac = 0;
  if (mode !== "start" && el.duration && isFinite(el.duration)) {
    const tr = trimOf(segIndex);
    const a = tr.start || 0, b = Math.max(a + 0.1, el.duration - (tr.end || 0));
    frac = Math.min(1, Math.max(0, (el.currentTime - a) / (b - a)));
  }
  const d = dotEls[segIndex];
  if (d) d.firstChild.style.width = (d.classList.contains("done") ? 100 : frac * 100) + "%";
  if (isDeparture(segIndex) && mode === "playing") musicDepartureEnvelope(frac);
  requestAnimationFrame(paintProgress);
}

// ---------- tweak pane (ordered by appearance) ----------
const rowsEl = document.getElementById("clipRows");
clipOrder.forEach((key) => {
  const c = clips[key];
  const row = document.createElement("div");
  row.className = "clipRow";
  const isCity = ["karachi","hawaii","sf","lisbon"].includes(key);
  row.innerHTML = `<div class="nm">${c.label}</div>
    <label>start <input type="number" min="0" step="0.1" value="${trims[key].start}" data-k="${key}" data-f="start"></label>
    <label>end <input type="number" min="0" step="0.1" value="${trims[key].end}" data-k="${key}" data-f="end"></label>`
    + (isCity ? `<input class="music" type="text" placeholder="YouTube URL for ${c.label} music" value="${music[key] || ""}" data-mk="${key}">` : "");
  rowsEl.appendChild(row);
});
rowsEl.addEventListener("input", (e) => {
  const k = e.target.dataset.k, f = e.target.dataset.f, mk = e.target.dataset.mk;
  if (k && f) trims[k][f] = Math.max(0, parseFloat(e.target.value) || 0);
  if (mk) {
    music[mk] = e.target.value.trim();
    const vid = ytId(music[mk]);
    if (ytReady && vid) {
      if (ytPlayers[mk]) { try { ytPlayers[mk].cueVideoById(vid); } catch(e) {} }
      else makePlayer(mk, vid);
    }
  }
});
document.getElementById("copyBtn").addEventListener("click", () => {
  const json = JSON.stringify({ trims, music }, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    document.getElementById("copied").textContent = "copied!";
    setTimeout(()=>document.getElementById("copied").textContent="", 1500);
  }).catch(()=>{ document.getElementById("copied").textContent = json; });
});
let paneOpen = false;
function togglePane() {
  paneOpen = !paneOpen;
  tweaks.style.display = paneOpen ? "block" : "none";
}

// boot
load(cur(), 0);
cur().pause();
cur().style.opacity = 1;
updateHud();
requestAnimationFrame(paintProgress);
requestAnimationFrame(scheduler);

document.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); togglePane(); return; }
  if (paneOpen && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.repeat) return;
  if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); goBack(); }
  else if (e.key === " " || e.key === "ArrowRight")   { e.preventDefault(); goForward(); }
});

let hudTimer = null;
function wakeHud() {
  hud.classList.remove("fade-out");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.add("fade-out"), 4000);
}
document.addEventListener("keydown", wakeHud);
document.addEventListener("mousemove", wakeHud);
document.addEventListener("mousedown", wakeHud);
document.addEventListener("touchstart", wakeHud, { passive: true });
wakeHud();
</script>
</body>
</html>
